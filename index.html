<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mena & Jova - Our Wedding</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500&family=Playfair+Display:wght@400;500;600&family=Cinzel:wght@400;500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="background.css">
</head>
<body>
    <section class="hero-page">
        <div class="hero-img">
            <img src="photos/heart.jpeg" alt="Mena&Jova">
        </div>
        <div class="hero-content">
            <div class="icon"><img src="photos/pl-removebg-preview.png" alt="Element"></div>
            <h1>
                Mena<span class="amp">&amp;</span> Jova
                <span>Our Wedding</span>
            </h1>
        </div>
        <div class="scroll-down">
            <span class="arrow"> ⌵ </span>
            <p>A New Chapter Begins</p>
        </div>
    </section>

    <section class="date-page">
        <div class="date-content">
            <div class="top-branch">
                <img src="photos/pl-removebg-preview.png" alt="branch">
            </div>

            <p class="save-date">Save the Date</p>

            <div class="wedding-date">
                <div class="month">
                    <span>OCT</span>
                </div>
                <div class="day">
                    <span>11</span>
                </div>
                <div class="year">
                    <span>2026</span>
                </div>
            </div>

            <p class="day-time">
                SUNDAY &nbsp;&bull;&nbsp; 7:00 PM
            </p>

            <div class="heart-line">
                <span></span>
                <b>♥</b>
                <span></span>
            </div>

            <p class="countdown-title">
                TIME LEFT UNTIL OUR WEDDING
            </p>
            
            <div class="countdown">
                <div class="countbox">
                    <span id="days">00</span>
                    <small>Days</small>
                </div>
                <div class="time-sep">|</div>
                <div class="countbox">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>
                <div class="time-sep">|</div>
                <div class="countbox">
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>
                <div class="time-sep">|</div>
                <div class="countbox">
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>
            </div>

            <div class="bottom-branch">
                <img src="photos/WhatsApp_Image_2026-10-04_at_4.08.40_AM-removebg-preview.png" alt="branch">
            </div>

            <div class="invitation-message">
                <p>Two hearts, one journey...</p>
                <p>
                    and we'd be honored to have you <br>
                    with us on our special day.
                </p>
                <span class="footer-heart">♥</span>
            </div>
        </div>
    </section>

    <script src="background.js"></script>
</body>
</html>
